<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Practise multiple-choice exam question banks. Runs entirely in your browser.">
  <title>ServiceNow Exam Training</title>
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var t = 'system';
      try {
        var s = JSON.parse(localStorage.getItem('set:v1:settings') || 'null');
        if (s && (s.theme === 'light' || s.theme === 'dark' || s.theme === 'system')) t = s.theme;
      } catch (e) { /* storage blocked — keep default */ }
      if (t === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#/" aria-label="ServiceNow Exam Training — library">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1.5" y="1.5" width="29" height="29" rx="8" class="brand__bg"/>
          <path d="M9 16.5l4.5 4.5L23 11.5" class="brand__tick"/>
        </svg>
        <span class="brand__name">ServiceNow Exam Training</span>
      </a>
      <div class="app-header__tools">
        <div id="timer" class="timer" role="timer" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2M9.5 2.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="timer__text num"></span>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <a class="icon-btn" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div id="banner" class="banner-slot"></div>

  <main id="main" class="app-main" tabindex="-1">
    <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="app-footer">
    <p class="app-footer__credit">Created by Gideon Vermeulen</p>
  </footer>

  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/fsrs.js"></script>
  <script src="js/weighting.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
