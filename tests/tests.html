<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — ServiceNow Exam Training</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0f1a; color: #e6ecf5; margin: 0; padding: 24px 16px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    #summary { font-weight: 700; padding: 12px 16px; border-radius: 10px; margin: 12px 0 20px; }
    #summary.pass { background: rgba(74, 222, 128, .12); color: #4ade80; }
    #summary.fail { background: rgba(248, 113, 113, .12); color: #f87171; }
    h2 { font-size: 1rem; margin: 20px 0 6px; color: #a0acc0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 4px 0; font-size: .92rem; border-bottom: 1px solid #1f2a40; }
    .pass b { color: #4ade80; } .fail b { color: #f87171; }
    .detail { display: block; color: #fca5a5; font-size: .85rem; margin-left: 52px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Unit tests</h1>
  <div id="summary">Running…</div>
  <div id="out"></div>
</main>

<script src="../js/storage.js"></script>
<script src="../js/bank.js"></script>
<script src="../js/fsrs.js"></script>
<script src="../js/weighting.js"></script>
<script src="../js/practice.js"></script>
<script src="../js/exam.js"></script>
<script src="../js/stats.js"></script>
<script src="../js/editor.js"></script>
<script src="tprm-data.js"></script>
<script>
(function () {
  'use strict';
  // Keep tests away from real user data.
  SET.storage.setPrefix('set-test:v1:');

  var B = SET.bank, W = SET.weighting, P = SET.practice, E = SET.exam;
  var out = document.getElementById('out');
  var passed = 0, failed = 0, list = null;

  function group(name) {
    var h = document.createElement('h2'); h.textContent = name; out.appendChild(h);
    list = document.createElement('ul'); out.appendChild(list);
  }
  function report(ok, name, detail) {
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    var b = document.createElement('b'); b.textContent = ok ? 'PASS ' : 'FAIL ';
    li.appendChild(b);
    li.appendChild(document.createTextNode(name));
    if (!ok && detail) { var d = document.createElement('span'); d.className = 'detail'; d.textContent = detail; li.appendChild(d); }
    list.appendChild(li);
    if (ok) passed++; else failed++;
  }
  function test(name, fn) {
    try { fn(); report(true, name); }
    catch (e) { report(false, name, e && e.message ? e.message : String(e)); }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function eq(a, b, msg) {
    var x = JSON.stringify(a), y = JSON.stringify(b);
    if (x !== y) throw new Error((msg ? msg + ': ' : '') + 'expected ' + y + ', got ' + x);
  }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > (eps || 1e-9)) throw new Error((msg ? msg + ': ' : '') + 'expected ≈' + b + ', got ' + a); }
  function hasError(res, fragment) {
    return res.errors.some(function (e) { return e.indexOf(fragment) >= 0; });
  }
  function bank(questions, extra) {
    var b = { title: 'T', questions: questions };
    if (extra) Object.keys(extra).forEach(function (k) { b[k] = extra[k]; });
    return b;
  }
  function q(id, answer, n) {
    var opts = []; for (var i = 0; i < (n || 4); i++) opts.push('Option ' + i + ' of ' + id);
    return { id: id, question: 'Question ' + id + '?', options: opts, answer: answer };
  }
  function seeded(seed) { // mulberry32
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Old-shape (pre-FSRS) progress record, as stored by earlier versions.
  function prog(seen, correct, streak, recent, lastCorrect) {
    return { seen: seen, correct: correct, streak: streak, recent: recent, lastSeen: '2026-01-01T00:00:00.000Z', lastCorrect: lastCorrect };
  }
  var DAY = 86400000;
  function iso(ms) { return new Date(ms).toISOString(); }
  // FSRS-shape record. dueIn: days from now (negative = overdue).
  function fp(stability, lastGrade, dueIn, difficulty) {
    return { reps: 3, lapses: 0, difficulty: difficulty === undefined ? 5 : difficulty, stability: stability,
      due: iso(Date.now() + dueIn * DAY), lastReview: iso(Date.now() - DAY), lastGrade: lastGrade,
      seen: 3, correct: lastGrade === 1 ? 2 : 3, streak: lastGrade === 1 ? 0 : 3 };
  }
  var MASTERED = function () { return fp(30, 3, 10, 2); };
  var WEAK = function () { return fp(2, 1, 1, 7); };

  /* 1. Validation */
  group('1. Validation');
  test('current format is valid', function () {
    var r = B.normalise(bank([q('a', [1]), q('b', [0, 2])], { description: ' d ', exam: { questionCount: 1, timeLimitMinutes: 10, passMarkPercent: 80 } }), 'x.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions.length, 2);
    eq(r.bank.description, 'd');
    eq(r.bank.exam, { questionCount: 1, timeLimitMinutes: 10, passMarkPercent: 80 });
  });
  test('legacy top-level array {q,o,a,u} converts', function () {
    var r = B.normalise([{ q: ' What? ', o: ['x', 'y', 'z'], a: [2], u: true }], 'legacy.json');
    assert(r.ok, r.errors.join('; '));
    var x = r.bank.questions[0];
    eq(x.question, 'What?'); eq(x.options, ['x', 'y', 'z']); eq(x.answer, [2]); eq(x.unverified, true);
    eq(r.bank.title, 'legacy');
  });
  test('legacy object with questions converts', function () {
    var r = B.normalise({ title: 'L', questions: [{ q: 'Q1', o: ['a', 'b'], a: 0 }] }, 'l.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions[0].answer, [0]);
  });
  test('letter answers normalise ("b", ["A","C"])', function () {
    var r = B.normalise(bank([q('a', 'b'), q('b', ['C', 'a']), q('c', [3, 'A', 0])]), 'x.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions[0].answer, [1]);
    eq(r.bank.questions[1].answer, [0, 2]);
    eq(r.bank.questions[2].answer, [0, 3]);
  });
  test('out-of-range answer is an error with position', function () {
    var qs = []; for (var i = 1; i <= 14; i++) qs.push(q('tprm-' + ('00' + i).slice(-3), [0]));
    qs[13].answer = [5];
    var r = B.normalise(bank(qs), 'x.json');
    assert(!r.ok);
    assert(hasError(r, 'Question 14 (id tprm-014): answer index 5 is out of range (4 options).'), r.errors.join('; '));
  });
  test('out-of-range letter is an error', function () {
    var r = B.normalise(bank([q('a', 'E')]), 'x.json');
    assert(!r.ok && hasError(r, 'out of range'), r.errors.join('; '));
  });
  test('empty options is an error', function () {
    var r = B.normalise(bank([{ id: 'a', question: 'Q', options: [], answer: 0 }]), 'x.json');
    assert(!r.ok && hasError(r, 'options'), r.errors.join('; '));
  });
  test('duplicate ids are an error', function () {
    var r = B.normalise(bank([q('a', 0), q('a', 1)]), 'x.json');
    assert(!r.ok && hasError(r, 'already used'), r.errors.join('; '));
  });
  test('missing title falls back to file name', function () {
    var r = B.normalise({ questions: [q('a', 0)] }, 'C:\\banks\\my-bank.json');
    eq(r.bank.title, 'my-bank');
  });
  test('invalid JSON blocks import', function () {
    var r = B.parse('{ nope', 'x.json');
    assert(!r.ok && hasError(r, 'not valid JSON'));
  });
  test('duplicate option text, duplicate question text and unknown fields are warnings', function () {
    var a = q('a', 0); a.options[1] = ' option 0 OF a '; a.extra = 1;
    var b = q('b', 0); b.question = 'Question a?';
    var r = B.normalise(bank([a, b], { foo: 1 }), 'x.json');
    assert(r.ok, r.errors.join('; '));
    assert(r.warnings.length >= 4, r.warnings.join('; '));
  });
  test('summary text', function () {
    var a = q('a', 0); a.unverified = true;
    var r = B.normalise(bank([a, q('b', 1)]), 'x.json');
    eq(B.summaryText(r.bank, 0), "Bank 'T', 2 questions, 1 unverified, 0 warnings");
  });
  test('exam questionCount is kept as written (uses cap it at the bank size)', function () {
    var r = B.normalise(bank([q('a', 0), q('b', 0)]), 'x.json');
    eq(r.bank.exam.questionCount, 60, 'default kept, so adding questions later can reach it');
    r.bank.id = 'qc';
    var e = E.createSession(r.bank, { count: Math.min(r.bank.exam.questionCount, r.bank.questions.length), timeLimitMinutes: 0, passMarkPercent: 70 }, seeded(1), 1000);
    eq(e.ids.length, 2);
  });

  /* 2. Identity */
  group('2. Identity');
  test('whitespace/case variants give the same fallback id', function () {
    eq(B.fallbackId('  What   IS\tthis? '), B.fallbackId('what is this?'));
    assert(/^h-[0-9a-f]{8}$/.test(B.fallbackId('x')));
  });
  test('FNV-1a known value', function () { eq(B.fnv1a(''), '811c9dc5'); eq(B.fnv1a('a'), 'e40c292c'); });
  test('questions without ids get stable fallback ids', function () {
    var r1 = B.normalise([{ question: 'Hello  World', options: ['a', 'b'], answer: 0 }], 'x.json');
    var r2 = B.normalise([{ question: 'hello world', options: ['a', 'b'], answer: 0 }], 'x.json');
    eq(r1.bank.questions[0].id, r2.bank.questions[0].id);
  });

  /* 3. Merge on update */
  group('3. Merge on update');
  test('kept / new / removed counts and progress', function () {
    var oldB = B.normalise(bank([q('a', 0), q('b', 0), q('c', 0)]), 'x.json').bank;
    var newB = B.normalise(bank([q('b', 0), q('c', 1), q('d', 0), q('e', 0)]), 'x.json').bank;
    var progress = { a: prog(1, 1, 1, [true], true), b: prog(2, 1, 0, [true, false], false) };
    var m = B.mergeUpdate(oldB, newB, progress);
    eq([m.kept, m.added, m.removed], [2, 2, 1]);
    eq(m.progress.b, progress.b);
    assert(!m.progress.a, 'removed id progress deleted');
    assert(!m.progress.d, 'new id starts as New');
  });

  /* 4. Weakness and weight */
  group('4. Weakness and weight');
  var cases = [
    { name: 'new', p: null, status: 'new', w: 0.75, weights: [1, 3.25, 6.25] },
    { name: 'weak (last grade Again)', p: fp(2, 1, 1, 7), status: 'weak', w: 1, weights: [1, 4, 8] },
    { name: 'learning, not yet due (D 5 → 0.15)', p: fp(10, 3, 4, 5), status: 'learning', w: 0.15, weights: [1, 1.45, 2.05] },
    { name: 'mastered, not yet due (D 2 → 0.06)', p: fp(30, 3, 10, 2), status: 'mastered', w: 0.06, weights: [1, 1.18, 1.42] },
    { name: 'learning, 5 days overdue at S 10 → 0.5', p: fp(10, 3, -5, 5), status: 'learning', w: 0.5, weights: [1, 2.5, 4.5] },
    { name: 'long overdue is capped at 0.8', p: fp(2, 4, -10, 5), status: 'learning', w: 0.8, weights: [1, 3.4, 6.6] },
    { name: 'mastered then missed → weak', p: W.record(fp(30, 3, 10, 2), 1), status: 'weak', w: 1, weights: [1, 4, 8] },
    { name: 'legacy record, last answer wrong → weak', p: prog(3, 2, 0, [true, true, false], false), status: 'weak', w: 1, weights: [1, 4, 8] }
  ];
  cases.forEach(function (c) {
    test(c.name + ': status, w and weight at F = 1, 4, 8', function () {
      eq(W.status(c.p), c.status, 'status');
      near(W.weakness(c.p), c.w, 1e-6, 'w');
      [1, 4, 8].forEach(function (F, i) { near(W.weight(c.p, F), c.weights[i], 1e-5, 'weight F=' + F); });
    });
  });
  test('legacy records migrate on read and keep their counters', function () {
    var old = prog(4, 3, 2, [false, true, true, true], true);
    var p = W.get({ x: old }, 'x');
    eq([p.reps, p.lapses, p.difficulty, p.stability, p.lastGrade], [4, 0, 5, 6, 3]);
    eq([p.seen, p.correct, p.streak], [4, 3, 2]);
    eq(p.due, iso(Date.parse(old.lastSeen) + 6 * DAY), 'due one interval after last seen'); eq(p.lastReview, old.lastSeen);
    eq(old.reps, undefined, 'stored record is not modified');
    var next = W.record(p, 3, '2026-02-01T00:00:00.000Z');
    eq([next.seen, next.correct, next.streak, next.reps], [5, 4, 3, 5]);
    assert(next.recent === undefined && next.lastCorrect === undefined, 'new shape only');
  });

  /* 5. Sampling */
  group('5. Sampling');
  var ids30 = []; for (var i = 0; i < 30; i++) ids30.push('q' + i);
  test('no duplicates', function () {
    for (var t = 0; t < 200; t++) {
      var s = W.weightedSample(ids30, function () { return 1 + Math.random() * 7; }, 10);
      var seen = {}; s.forEach(function (x) { assert(!seen[x], 'duplicate ' + x); seen[x] = 1; });
      eq(s.length, 10);
    }
  });
  test('returns min(n, pool)', function () {
    eq(W.weightedSample(ids30, function () { return 1; }, 50).length, 30);
    eq(W.weightedSample([], function () { return 1; }, 5).length, 0);
  });
  test('20,000 single draws from {4, 1} ≈ 4:1 (±10%)', function () {
    var a = 0, b = 0;
    for (var t = 0; t < 20000; t++) {
      var s = W.weightedSample(['A', 'B'], function (x) { return x === 'A' ? 4 : 1; }, 1);
      if (s[0] === 'A') a++; else b++;
    }
    var ratio = a / b;
    assert(ratio >= 3.6 && ratio <= 4.4, 'ratio ' + ratio.toFixed(3));
  });
  test('Strong focus favours weak questions', function () {
    var qs = ids30.map(function (id) { return { id: id }; });
    var progress = {};
    ids30.forEach(function (id, i) { progress[id] = i < 5 ? WEAK() : MASTERED(); });
    var weakHits = 0;
    for (var t = 0; t < 2000; t++) {
      var pick = W.selectPractice(qs, progress, 5, 2).ids;
      weakHits += pick.filter(function (id) { return Number(id.slice(1)) < 5; }).length;
    }
    // Weak share of weight: 5*4 / (5*4 + 25*1.18) = 40% of draws ≫ the 17% uniform share.
    assert(weakHits / (2000 * 5) > 0.3, 'weak share ' + (weakHits / 10000).toFixed(3));
  });

  /* 6. Weak only */
  group('6. Weak only');
  var wq = ['m1', 'm2', 'm3', 'x1', 'x2'].map(function (id) { return { id: id }; });
  var mp = { m1: MASTERED(), m2: MASTERED(), m3: MASTERED(), x1: WEAK() };
  test('pool excludes Mastered', function () {
    for (var t = 0; t < 100; t++) {
      var r = W.selectPractice(wq, mp, 2, 4);
      eq(r.ids.slice().sort(), ['x1', 'x2']);
      eq(r.notice, null);
    }
  });
  test('fills from Mastered when the pool is too small', function () {
    var r = W.selectPractice(wq, mp, 4, 4);
    eq(r.ids.length, 4);
    assert(r.ids.indexOf('x1') >= 0 && r.ids.indexOf('x2') >= 0, 'pool included');
    eq(r.ids.filter(function (id) { return id[0] === 'm'; }).length, 2);
  });
  test('falls back to Strong when everything is mastered', function () {
    var all = { m1: mp.m1, m2: mp.m2, m3: mp.m3, x1: mp.m1, x2: mp.m1 };
    var r = W.selectPractice(wq, all, 3, 4);
    eq(r.ids.length, 3);
    eq(r.notice, W.ALL_MASTERED_NOTICE);
  });

  /* 7. Attempt counting */
  group('7. Attempt counting');
  var tb = B.normalise(bank([q('a', [1]), q('b', [0, 2]), q('c', [3])]), 'x.json').bank;
  tb.id = 'test-bank';
  var tmap = B.byId(tb);
  var T1 = '2026-03-01T09:00:00.000Z', T2 = '2026-03-01T09:05:00.000Z';
  test('round 1 counts; wrong is Again at once, right waits for a rating; retries do not change progress', function () {
    var progress = {};
    var s = P.createSession(tb, ['a', 'b', 'c'], progress, { focus: 2 });
    P.applyAnswer(s, progress, tmap.a, [0], T1);    // wrong
    eq(P.needsRating(s, tmap.a), false, 'wrong answers are not rated');
    eq(progress.a.seen, 1); eq(progress.a.streak, 0); eq(progress.a.lastGrade, 1);
    P.applyAnswer(s, progress, tmap.b, [2, 0], T1); // right (order-insensitive)
    eq(P.needsRating(s, tmap.b), true);
    assert(!progress.b, 'right answer not recorded before rating');
    P.applyRating(s, progress, tmap.b, 2, T1);
    eq(progress.b.correct, 1); eq(progress.b.streak, 1); eq(progress.b.lastGrade, 2);
    P.applyAnswer(s, progress, tmap.c, [3], T1);    // right
    P.applyRating(s, progress, tmap.c, 4, T1);
    eq(progress.c.lastGrade, 4);
    P.finishRound(s);
    eq(P.firstAttemptCorrect(s), 2);
    var before = JSON.stringify(progress);
    P.startRetry(s);
    eq(s.queue, ['a']);
    P.applyAnswer(s, progress, tmap.a, [1], T2);
    eq(P.needsRating(s, tmap.a), false, 'retry rounds are not rated');
    P.applyRating(s, progress, tmap.a, 4, T2);
    eq(JSON.stringify(progress), before, 'progress unchanged in retry');
    assert(s.solved.a, 'retry still marks solved');
  });
  test('the exam date cap is carried on the practice session', function () {
    var progress = {};
    var s = P.createSession(tb, ['a'], progress, { focus: 2, maxIntervalDays: 2 });
    P.applyAnswer(s, progress, tmap.a, [1], T1);
    P.applyRating(s, progress, tmap.a, 4, T1); // Easy on a new card would be ~16 days
    eq(progress.a.due, iso(Date.parse(T1) + 2 * DAY));
  });
  test('partial multi-answer selection is wrong (all-or-nothing)', function () {
    assert(!W.isCorrect([0], [0, 2]));
    assert(!W.isCorrect([0, 1, 2], [0, 2]));
    assert(W.isCorrect([2, 0], [0, 2]));
  });
  test('exam answers update progress; unanswered are wrong', function () {
    var progress = { a: prog(3, 3, 3, [true, true, true], true) };
    var s = E.createSession(tb, { count: 3, timeLimitMinutes: 90, passMarkPercent: 60 }, seeded(1), 1000);
    s.answers = { a: [0], b: [0, 2] }; // a wrong, b right, c unanswered
    var r = E.grade(s, tmap, progress, 61000);
    eq(r.correct, 1); eq(r.total, 3); eq(r.scorePercent, 33); eq(r.passed, false);
    eq(r.timeUsedSec, 60);
    eq(progress.a.streak, 0, 'streak resets on a miss');
    eq(W.status(progress.a), 'weak');
    eq(progress.a.lastGrade, 1, 'wrong = Again');
    eq(progress.b.seen, 1);
    eq(progress.b.lastGrade, 3, 'right = Good');
    assert(!progress.c, 'unanswered not recorded');
  });
  test('streak resets on a miss and rebuilds; seen and correct keep counting', function () {
    var p = null;
    [3, 3, 1, 3, 2, 4].forEach(function (g) { p = W.record(p, g, T1); });
    eq(p.streak, 3); eq(p.seen, 6); eq(p.correct, 5); eq(p.reps, 6); eq(p.lapses, 1);
  });

  /* 8. Option shuffle */
  group('8. Option shuffle');
  test('remapped answer still checks as correct', function () {
    var rng = seeded(42);
    for (var t = 0; t < 500; t++) {
      var n = 2 + Math.floor(rng() * 9);
      var answer = W.shuffle(Array.from({ length: n }, function (_, i) { return i; }), rng).slice(0, 1 + Math.floor(rng() * n)).sort(function (a, b) { return a - b; });
      var order = W.optionOrder(n, true, rng);
      var shown = W.toDisplay(order, answer);
      var back = W.toOriginal(order, shown);
      assert(W.isCorrect(back, answer), 'order ' + order + ' answer ' + answer);
      shown.forEach(function (d) { assert(answer.indexOf(order[d]) >= 0, 'display position maps to an answer'); });
    }
  });
  test('no shuffle keeps original order', function () { eq(W.optionOrder(4, false), [0, 1, 2, 3]); });

  /* 9. Real bank */
  group('9. banks/tprm.json');
  // banks/tprm.json is kept out of the repository, so these run only where the local copy exists.
  function needsTprm(name, fn) {
    if (window.TPRM_BANK) test(name, fn);
    else test(name + ' (skipped: tests/tprm-data.js not present)', function () {});
  }
  needsTprm('validates with 0 errors and 180 questions', function () {
    var r = B.normalise(JSON.parse(JSON.stringify(window.TPRM_BANK)), 'tprm.json');
    eq(r.errors.length, 0, r.errors.slice(0, 3).join('; '));
    eq(r.bank.questions.length, 180);
    eq(r.bank.title, 'ServiceNow CIS-TPRM practice');
  });

  /* 10. FSRS state update
     Expected values come from the reference ts-fsrs 4.x (FSRS-5, same default weights),
     not from this implementation, so a transcription error in a formula fails here. */
  group('10. FSRS state update');
  var F = SET.fsrs;
  var NOW = Date.parse('2026-06-01T12:00:00.000Z');
  test('first review: stability and difficulty from the grade alone', function () {
    var expect = { 1: [0.40255, 7.1949, 1], 2: [1.18385, 6.48830527, 1], 3: [3.173, 5.28243442, 3], 4: [15.69105, 3.22450159, 16] };
    [1, 2, 3, 4].forEach(function (g) {
      var n = F.next(null, g, NOW, null);
      near(n.stability, expect[g][0], 1e-6, 'S grade ' + g);
      near(n.difficulty, expect[g][1], 1e-6, 'D grade ' + g);
      eq(n.reps, 1); eq(n.lapses, 0);
      eq(n.due, iso(NOW + expect[g][2] * DAY), 'due grade ' + g);
      eq(n.lastReview, iso(NOW));
    });
  });
  var existing = { difficulty: 5, stability: 10, reps: 3, lapses: 0, lastReview: iso(NOW - 10 * DAY) };
  test('retrievability is 0.9 after S days', function () { near(F.retrievability(10, 10), 0.9, 1e-12); near(F.interval(10), 10, 1e-9); });
  test('success on an existing card (D 5, S 10, 10 days elapsed)', function () {
    var expect = { 2: [15.31391211, 5.7994339], 3: [32.95426399, 4.99183271], 4: [78.62865848, 4.18423151] };
    [2, 3, 4].forEach(function (g) {
      var n = F.next(existing, g, NOW, null);

  function topicBank(spec) { // spec: { topic: count }
    var qs = [];

      a: rec(5, 0, 1),  // 0/5 → 0.14
      b: rec(1, 0, 1),  // 0/1 → 0.33
      c: rec(4, 2, 3),  // 2/4 → 0.5, 2 misses
      d: rec(2, 1, 1),  // 1/2 → 0.5, 1 miss, wrong last time
      e: rec(6, 6, 3)   // never wrong: not listed
    };
    eq(SET.stats.weakestRows({ questions: qs }, progress).map(function (r) { return r.q.id; }), ['a', 'b', 'c', 'd']);
    eq(SET.stats.weakestRows({ questions: qs }, {}).length, 0);
  });
  test('an exam summary keeps its review and reopens as the same results', function () {
    var eb = B.normalise(bank(sq, { exam: { topicWeights: { A: 20, B: 50, C: 30 } } }), 'x.json').bank;
    eb.id = 'strat-bank';

    s.ids.forEach(function (id, i) { if (i % 3) s.answers[id] = [i % 2]; });
    s.flags[s.ids[0]] = true;
    var live = E.grade(s, B.byId(eb), {}, 2000);
    var again = E.resultFromSummary('strat-bank', JSON.parse(JSON.stringify(live.summary)));
    eq(again.items, live.items);
    eq(again.byTopic, live.byTopic);
    eq([again.correct, again.total, again.scorePercent, again.passed, again.timeUsedSec],
      [live.correct, live.total, live.scorePercent, live.passed, live.timeUsedSec]);
    eq(E.resultFromSummary('x', { mode: 'exam', size: 3 }), null, 'older summaries without a review');
    eq(E.resultFromSummary('x', { mode: 'practice', review: { items: [] } }), null);
  });
  test('only the 30 most recent exams keep their full review', function () {
    SET.storage.deleteAll();

  /* 18. Bug fixes */
  group('18. Bug fixes');
  test('#2 upgrading: old Mastered stays Mastered, and old questions are not all due at once', function () {
    var longAgo = prog(5, 5, 4, [true, true, true, true], true);            // last seen 2026-01-01
    var recent = prog(5, 5, 3, [true, true, true], true); recent.lastSeen = iso(Date.now() - DAY);
    var learning = prog(2, 1, 1, [false, true], true); learning.lastSeen = iso(Date.now() - DAY);
    eq(W.status(longAgo), 'mastered');
    eq(W.status(recent), 'mastered');
    eq(W.isDue(recent), false, 'studied yesterday, mastered: not due');
    eq(W.isDue(learning), false, 'studied yesterday, 3-day seed: not due yet');
    eq(W.isDue(longAgo), true, 'months ago: genuinely due');
    eq(W.isDue(prog(2, 1, 0, [true, false], false)), true, 'wrong last time: due');
  });
  test('#4 / #7a the right answer "changed" only when it is different text', function () {
    var base = { options: ['Alpha', 'Beta', 'Gamma'], answer: [0] };
    var c = function (options, answer) { return B.answerChanged(base, { options: options, answer: answer }); };
    eq(c(['Alpha', 'Beta', 'Gamma'], [0]), false, 'unchanged');
    eq(c(['Beta', 'Alpha', 'Gamma'], [1]), false, 'options reordered');
    eq(c(['Alpha', 'Beta', 'Gamma', 'Delta'], [0]), false, 'distractor added');
    eq(c(['Alpha!', 'Beta', 'Gamma'], [0]), false, 'typo fixed in the answer');
    eq(c(['Alpha', 'Beta', 'Gamma'], [1]), true, 'different option chosen');
    eq(c(['Beta', 'Alpha', 'Gamma'], [0]), true, 'texts swapped, same letter');
    eq(c(['Alpha', 'Beta', 'Gamma'], [0, 2]), true, 'second answer added');
  });
  test('#4 re-uploading resets progress only where the answer changed', function () {
    var oldB = B.normalise(bank([q('a', 0), q('b', 0)]), 'x.json').bank;
    var nb = bank([q('a', 0), q('b', 1)]);
    nb.questions[0].question = 'Reworded a?';

  test('#9 a record with no last-review time still moves forward', function () {

  /* 19. Readiness calibration */
  group('19. Readiness calibration');
  function ex(predicted, score, answered, size) {
    return { mode: 'exam', predicted: predicted, scorePercent: score, answered: answered === undefined ? 60 : answered, size: size || 60 };
  }
  test('no usable mock exams = no correction', function () {
    eq(W.calibration([]), { bias: 0, exams: 0 });
    eq(W.calibration([{ mode: 'exam', scorePercent: 50, size: 60 }, { mode: 'practice', predicted: 70, scorePercent: 40 }]), { bias: 0, exams: 0 }, 'older exams without a prediction');
  });
  test('the correction grows with evidence and is pulled towards zero early on', function () {
    eq(W.calibration([ex(70, 61)]), { bias: -3, exams: 1 }, '1 exam: −9 / 3');
    eq(W.calibration([ex(70, 61), ex(72, 63)]), { bias: -5, exams: 2 }, '2 exams: −18 / 4 = −4.5');
    eq(W.calibration([ex(70, 61), ex(72, 63), ex(68, 59), ex(71, 62), ex(69, 60)]), { bias: -6, exams: 5 }, '5 exams: −45 / 7');
    eq(W.calibration([ex(60, 70), ex(60, 70), ex(60, 70)]).bias, 6, 'underestimates correct upwards');
  });
  test('uses only the last 5, skips mostly-unanswered exams, and caps at ±20', function () {
    var old = [ex(90, 10), ex(90, 10), ex(90, 10)];
    eq(W.calibration(old.concat([ex(70, 70), ex(70, 70), ex(70, 70), ex(70, 70), ex(70, 70)])).bias, 0, 'old exams roll off');
    eq(W.calibration([ex(70, 20, 30)]).exams, 0, 'half unanswered: ignored');
    eq(W.calibration([ex(100, 0), ex(100, 0), ex(100, 0), ex(100, 0), ex(100, 0)]).bias, -20);
  });
  test('expected score is the mean chance over exactly the drawn questions', function () {
    var qs = [q('a', [0]), q('b', [0])];
    near(W.expectedScore(qs, {}, NOW), 25, 1e-9, 'unseen 4-option questions');
    var good = { reps: 3, lapses: 0, difficulty: 3, stability: 60, lastReview: iso(NOW), lastGrade: 3, seen: 3, correct: 3 };
    var expect = Math.round((W.chanceRight(qs[0], good, NOW) + 0.25) / 2 * 1000) / 10;
    eq(W.expectedScore(qs, { a: good }, NOW), expect);
  });
  test('an exam stores its prediction and how many were answered', function () {
    var eb = B.normalise(bank([q('a', [0]), q('b', [0]), q('c', [0])]), 'x.json').bank; eb.id = 'cal';
    var s = E.createSession(eb, { count: 3, timeLimitMinutes: 0, passMarkPercent: 70 }, seeded(4), 1000);
    s.predicted = 41.5;
    s.answers = { a: [0], b: [1] };
    var r = E.grade(s, B.byId(eb), {}, 2000);
    eq([r.summary.predicted, r.summary.answered, r.predicted], [41.5, 2, 41.5]);
    eq(E.resultFromSummary('cal', JSON.parse(JSON.stringify(r.summary))).predicted, 41.5, 'kept when reopened');
    var plain = E.createSession(eb, { count: 3, timeLimitMinutes: 0, passMarkPercent: 70 }, seeded(4), 1000);
    eq(E.grade(plain, B.byId(eb), {}, 2000).summary.predicted, undefined, 'no prediction, no field');
  });

  /* 20. Chance of passing */
  group('20. Chance of passing');
  test('normal CDF matches known values', function () {
    near(W.normalCdf(0), 0.5, 1e-7); near(W.normalCdf(1.96), 0.9750021, 1e-6);
    near(W.normalCdf(-1), 0.1586553, 1e-6); near(W.normalCdf(0.6), 0.7257469, 1e-6);
  });
  test('worked example: readiness 75%, 60 questions, 70% pass mark, no mock exams yet ≈ 72%', function () {
    var c = W.passChance(75, 60, 70, []);
    eq([c.needed, c.modelError, c.band], [42, 8, 'borderline']);
    assert(c.percent === 72, 'got ' + c.percent);
  });
  test('right at the pass mark is about a coin flip; far above is likely, far below unlikely', function () {
    var at = W.passChance(69.2, 60, 70, []).percent;
    assert(at >= 48 && at <= 52, 'at the line: ' + at);
    eq(W.passChance(95, 60, 70, []).band, 'likely');
    eq(W.passChance(45, 60, 70, []).band, 'unlikely');
  });
  test('consistent mock exams shrink the uncertainty, erratic ones widen it', function () {
    var steady = [ex(70, 75), ex(70, 75), ex(70, 76), ex(70, 74)];
    var erratic = [ex(70, 55), ex(70, 90), ex(70, 60), ex(70, 85)];
    var calm = W.passChance(78, 60, 70, steady), wild = W.passChance(78, 60, 70, erratic);
    eq(calm.modelError, 3, 'floor of 3 points');
    assert(wild.modelError > 10, 'erratic: ' + wild.modelError);
    assert(calm.percent > W.passChance(78, 60, 70, []).percent && W.passChance(78, 60, 70, []).percent > wild.percent,
      [calm.percent, W.passChance(78, 60, 70, []).percent, wild.percent].join(' / '));
  });
  test('edge cases: 100% pass mark, tiny exams, extreme readiness', function () {
    eq(W.passChance(80, 10, 100, []).needed, 10);
    eq(W.passChance(80, 1, 70, []).needed, 1);
    assert(W.passChance(100, 60, 70, []).percent >= 99);
    assert(W.passChance(0, 60, 70, []).percent <= 1);
  });

  test('marking a question verified saves it, keeps progress and counts as an in-app change', function () {
    SET.storage.deleteAll();
    var b = B.normalise(bank([{ id: 'u', question: 'Unsure?', options: ['x', 'y'], answer: 0, unverified: true }]), 'x.json').bank;

    assert(SET.storage.getProgress('vb').u, 'progress kept');
    eq(SET.editor.setVerified('vb', 'u', false), true);
    eq(SET.storage.getBank('vb').questions[0].unverified, true, 'can be flagged again');

  test('readiness by topic reports how many questions of each topic were seen', function () {

  /* 21. Cramming */
  group('21. Cramming');
  test('repeating a question the same day does not raise its readiness', function () {
    var t0 = new Date(2026, 5, 1, 8, 0).getTime(), at = t0 + 30 * DAY;
    var qq = { options: ['a', 'b', 'c', 'd'], answer: [0] };
    var crammed = null;
    for (var i = 0; i < 8; i++) crammed = W.record(crammed, 3, iso(t0 + i * 3600000));
    var once = W.record(null, 3, iso(t0));
    eq([crammed.seen, crammed.correct, crammed.daySeen, crammed.dayCorrect], [8, 8, 1, 1]);
    near(W.chanceRight(qq, crammed, at), W.chanceRight(qq, once, at), 1e-12, 'same estimate');
  });
  test('the first answer of the day counts, even when later answers that day are right', function () {
    var t0 = new Date(2026, 5, 1, 8, 0).getTime();
    var p = W.record(null, 1, iso(t0));            // wrong first thing
    p = W.record(p, 3, iso(t0 + 3600000));         // right after seeing the answer
    p = W.record(p, 3, iso(t0 + 7200000));
    eq([p.daySeen, p.dayCorrect], [1, 0]);
    p = W.record(p, 3, iso(t0 + DAY));             // next day, right first time
    eq([p.daySeen, p.dayCorrect], [2, 1]);
  });
  test('Weakest 10 sees through same-day repeats', function () {
    var t0 = new Date(2026, 5, 1, 8, 0).getTime();
    var p = W.record(null, 1, iso(t0));
    for (var i = 1; i < 6; i++) p = W.record(p, 3, iso(t0 + i * 3600000));
    var rows = SET.stats.weakestRows({ questions: [{ id: 'x' }] }, { x: p });
    eq(rows.length, 1);
    near(rows[0].score, 1 / 3, 1e-12, '0 of 1 first answers, smoothed');
  });
  test('older records without daily counts fall back to all answers', function () {
    var old = fp(10, 3, 5); delete old.daySeen; delete old.dayCorrect;
    eq(W.daily(old), { seen: 3, correct: 3 });
    var next = W.record(old, 3, iso(NOW));
    eq([next.daySeen, next.dayCorrect], [4, 4]);
  });

  /* 22. Hostile or damaged files */
  group('22. Hostile or damaged files');
  test('built-in names are refused as topics and ids, and dropped from topic weights', function () {
    ['__proto__', 'constructor', 'toString', 'hasOwnProperty', 'prototype'].forEach(function (name) {
      var t = q('a', 0); t.topic = name;
      var r1 = B.normalise(bank([t]), 'x.json');
      assert(!r1.ok && hasError(r1, 'topic "' + name + '" is a reserved name'), name + ' as topic: ' + r1.errors.join('; '));
      var r2 = B.normalise(bank([q(name, 0)]), 'x.json');
      assert(!r2.ok && hasError(r2, 'id "' + name + '" is a reserved name'), name + ' as id: ' + r2.errors.join('; '));
    });
    var w = B.normalise(JSON.parse('{"title":"T","exam":{"topicWeights":{"__proto__":50,"A":50}},"questions":[{"id":"a","question":"Q?","options":["x","y"],"answer":0,"topic":"A"}]}'), 'x.json');
    assert(w.ok, w.errors.join('; '));
    eq(Object.keys(w.bank.exam.topicWeights), ['A']);
    assert(w.warnings.some(function (x) { return x.indexOf('reserved name "__proto__"') >= 0; }), w.warnings.join('; '));
    eq(SET.editor.validate({ id: 'z', question: 'Q?', options: ['x', 'y'], answer: [0], topic: 'constructor' }).ok, false, 'editor uses the same rule');
  });
  test('internal tables have no built-in names, so nothing leaks onto every object', function () {
    // Bypass validation on purpose, as damaged stored data would.
    var qs = [{ id: 'a', question: 'A?', options: ['x', 'y'], answer: [0], topic: '__proto__' },
      { id: 'b', question: 'B?', options: ['x', 'y'], answer: [0], topic: 'constructor' },
      { id: 'c', question: 'C?', options: ['x', 'y'], answer: [0], topic: 'toString' }];
    eq(W.selectStratified(qs, null, 3, seeded(1)).length, 3, 'mock exam draws');
    eq(W.readiness(qs, {}, null, NOW).byTopic.length, 3);
    eq(E.topicBreakdown(qs.map(function (x) { return { id: x.id, correct: true }; }), B.byId({ questions: qs }), null).length, 3);
    eq(['sum', 'total', 'seen', 'n', 'push'].filter(function (k) { return k in {}; }), [], 'Object.prototype untouched');
    eq(B.byId({ questions: qs }).toString, undefined, 'id lookups have no built-ins');
  });
  test('backup progress and sessions with nonsense values are cleaned', function () {
    eq(SET.storage.cleanRecord({ reps: 'many', stability: 'abc', seen: 'lots' }), null, 'unusable core: starts as New');
    var r = SET.storage.cleanRecord({ reps: 3, stability: 12, difficulty: 5, seen: 'lots', correct: -5, due: 'never', lastGrade: 9, daySeen: 2, dayCorrect: 7 });
    eq([r.seen, r.correct, r.due, r.lastGrade, r.daySeen, r.dayCorrect], [0, 0, null, null, 2, 2]);
    eq(SET.storage.cleanRecord(prog(3, 2, 0, [true, true, false], false)).lastCorrect, false, 'pre-FSRS records still import');
    eq(SET.storage.cleanSession({ mode: 'exam', scorePercent: 'high', size: 'big', endedAt: 'soon' }), null);
    var sess = SET.storage.cleanSession({ id: 's', mode: 'exam', scorePercent: 80, size: 10, endedAt: iso(NOW), predicted: 'x',
      review: { items: [{ id: 'a', selected: 'B', correct: 'yes' }, 7], byTopic: [{ topic: { x: 1 } }] } });
    eq(sess.predicted, undefined);
    eq(sess.review, { items: [{ id: 'a', selected: [], correct: false, flagged: false }], byTopic: null });
  });
  test('damaged banks in a backup are skipped and named; good ones import', function () {
    SET.storage.deleteAll();
    var good = B.normalise(bank([q('a', 0), q('b', 1)]), 'x.json').bank;
    var data = { format: 'set-backup', version: 2, banks: [
      { entry: { id: 'good', title: 'T', updatedAt: iso(NOW) }, bank: JSON.parse(JSON.stringify(good)), progress: { a: fp(10, 3, 5), junk: 7 }, sessions: [{ mode: 'practice' }, 'x'] },
      { entry: { id: 'bad', title: 'Evil' }, bank: { title: { not: 'text' }, questions: [{ id: 'x', question: { bad: 1 }, options: 'nope', answer: 'A' }] } },
      { entry: { id: 'proto' }, bank: { title: 'Proto', questions: [{ id: 'p', question: 'Q?', options: ['x', 'y'], answer: 0, topic: '__proto__' }] } }
    ] };

    eq(SET.storage.getIndex().banks.map(function (b) { return b.id; }), ['good']);
    eq(Object.keys(SET.storage.getProgress('good')), ['a'], 'non-record progress dropped');
    eq(SET.storage.getSessions('good').length, 0, 'sessions without usable values dropped');
