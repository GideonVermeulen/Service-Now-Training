<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — ServiceNow Exam Training</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0f1a; color: #e6ecf5; margin: 0; padding: 24px 16px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    #summary { font-weight: 700; padding: 12px 16px; border-radius: 10px; margin: 12px 0 20px; }
    #summary.pass { background: rgba(74, 222, 128, .12); color: #4ade80; }
    #summary.fail { background: rgba(248, 113, 113, .12); color: #f87171; }
    h2 { font-size: 1rem; margin: 20px 0 6px; color: #a0acc0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 4px 0; font-size: .92rem; border-bottom: 1px solid #1f2a40; }
    .pass b { color: #4ade80; } .fail b { color: #f87171; }
    .detail { display: block; color: #fca5a5; font-size: .85rem; margin-left: 52px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Unit tests</h1>
  <div id="summary">Running…</div>
  <div id="out"></div>
</main>

<script src="../js/storage.js"></script>
<script src="../js/csv.js"></script>
<script src="../js/bank.js"></script>
<script src="../js/fsrs.js"></script>
<script src="../js/weighting.js"></script>
<script src="../js/optimizer.js"></script>
<script src="../js/practice.js"></script>
<script src="../js/exam.js"></script>
<script src="../js/stats.js"></script>
<script src="../js/editor.js"></script>
<script src="tprm-data.js"></script>
<script>
(function () {
  'use strict';
  // Keep tests away from real user data.
  SET.storage.setPrefix('set-test:v1:');
  SET.storage.deleteAll();       // start clean; also points the scheduler at default weights,
  SET.storage.syncScheduler();   // not a personalised set the real app may have saved

  var B = SET.bank, W = SET.weighting, P = SET.practice, E = SET.exam;
  var out = document.getElementById('out');
  var passed = 0, failed = 0, list = null;

  function group(name) {
    var h = document.createElement('h2'); h.textContent = name; out.appendChild(h);
    list = document.createElement('ul'); out.appendChild(list);
  }
  function report(ok, name, detail, target) {
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    var b = document.createElement('b'); b.textContent = ok ? 'PASS ' : 'FAIL ';
    li.appendChild(b);
    li.appendChild(document.createTextNode(name));
    if (!ok && detail) { var d = document.createElement('span'); d.className = 'detail'; d.textContent = detail; li.appendChild(d); }
    (target || list).appendChild(li);
    if (ok) passed++; else failed++;
  }
  function test(name, fn) {
    try { fn(); report(true, name); }
    catch (e) { report(false, name, e && e.message ? e.message : String(e)); }
  }
  // A test that returns a promise; the summary waits for it.
  var pending = [];
  function testAsync(name, fn) {
    var target = list;
    var done = function (ok, e) { report(ok, name, e && e.message ? e.message : e ? String(e) : '', target); };
    var p;
    try { p = Promise.resolve(fn()); } catch (e) { p = Promise.reject(e); }
    pending.push(p.then(function () { done(true); }, function (e) { done(false, e); }));
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function eq(a, b, msg) {
    var x = JSON.stringify(a), y = JSON.stringify(b);
    if (x !== y) throw new Error((msg ? msg + ': ' : '') + 'expected ' + y + ', got ' + x);
  }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > (eps || 1e-9)) throw new Error((msg ? msg + ': ' : '') + 'expected ≈' + b + ', got ' + a); }
  function hasError(res, fragment) {
    return res.errors.some(function (e) { return e.indexOf(fragment) >= 0; });
  }
  function bank(questions, extra) {
    var b = { title: 'T', questions: questions };
    if (extra) Object.keys(extra).forEach(function (k) { b[k] = extra[k]; });
    return b;
  }
  function q(id, answer, n) {
    var opts = []; for (var i = 0; i < (n || 4); i++) opts.push('Option ' + i + ' of ' + id);
    return { id: id, question: 'Question ' + id + '?', options: opts, answer: answer };
  }
  function seeded(seed) { // mulberry32
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Old-shape (pre-FSRS) progress record, as stored by earlier versions.
  function prog(seen, correct, streak, recent, lastCorrect) {
    return { seen: seen, correct: correct, streak: streak, recent: recent, lastSeen: '2026-01-01T00:00:00.000Z', lastCorrect: lastCorrect };
  }
  var DAY = 86400000;
  function iso(ms) { return new Date(ms).toISOString(); }
  // FSRS-shape record. dueIn: days from now (negative = overdue).
  function fp(stability, lastGrade, dueIn, difficulty) {
    return { reps: 3, lapses: 0, difficulty: difficulty === undefined ? 5 : difficulty, stability: stability,
      due: iso(Date.now() + dueIn * DAY), lastReview: iso(Date.now() - DAY), lastGrade: lastGrade,
      seen: 3, correct: lastGrade === 1 ? 2 : 3, streak: lastGrade === 1 ? 0 : 3 };
  }
  var MASTERED = function () { return fp(30, 3, 10, 2); };
  var WEAK = function () { return fp(2, 1, 1, 7); };

  /* 1. Validation */
  group('1. Validation');
  test('current format is valid', function () {
    var r = B.normalise(bank([q('a', [1]), q('b', [0, 2])], { description: ' d ', exam: { questionCount: 1, timeLimitMinutes: 10, passMarkPercent: 80 } }), 'x.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions.length, 2);
    eq(r.bank.description, 'd');
    eq(r.bank.exam, { questionCount: 1, timeLimitMinutes: 10, passMarkPercent: 80 });
  });
  test('legacy top-level array {q,o,a,u} converts', function () {
    var r = B.normalise([{ q: ' What? ', o: ['x', 'y', 'z'], a: [2], u: true }], 'legacy.json');
    assert(r.ok, r.errors.join('; '));
    var x = r.bank.questions[0];
    eq(x.question, 'What?'); eq(x.options, ['x', 'y', 'z']); eq(x.answer, [2]); eq(x.unverified, true);
    eq(r.bank.title, 'legacy');
  });
  test('legacy object with questions converts', function () {
    var r = B.normalise({ title: 'L', questions: [{ q: 'Q1', o: ['a', 'b'], a: 0 }] }, 'l.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions[0].answer, [0]);
  });
  test('letter answers normalise ("b", ["A","C"])', function () {
    var r = B.normalise(bank([q('a', 'b'), q('b', ['C', 'a']), q('c', [3, 'A', 0])]), 'x.json');
    assert(r.ok, r.errors.join('; '));
    eq(r.bank.questions[0].answer, [1]);
    eq(r.bank.questions[1].answer, [0, 2]);
    eq(r.bank.questions[2].answer, [0, 3]);
  });
  test('out-of-range answer is an error with position', function () {
    var qs = []; for (var i = 1; i <= 14; i++) qs.push(q('tprm-' + ('00' + i).slice(-3), [0]));
    qs[13].answer = [5];
    var r = B.normalise(bank(qs), 'x.json');
    assert(!r.ok);
    assert(hasError(r, 'Question 14 (id tprm-014): answer index 5 is out of range (4 options).'), r.errors.join('; '));
  });
  test('out-of-range letter is an error', function () {
    var r = B.normalise(bank([q('a', 'E')]), 'x.json');
    assert(!r.ok && hasError(r, 'out of range'), r.errors.join('; '));
  });
  test('empty options is an error', function () {
    var r = B.normalise(bank([{ id: 'a', question: 'Q', options: [], answer: 0 }]), 'x.json');
    assert(!r.ok && hasError(r, 'options'), r.errors.join('; '));
  });
  test('duplicate ids are an error', function () {
    var r = B.normalise(bank([q('a', 0), q('a', 1)]), 'x.json');
    assert(!r.ok && hasError(r, 'already used'), r.errors.join('; '));
  });
  test('missing title falls back to file name', function () {
    var r = B.normalise({ questions: [q('a', 0)] }, 'C:\\banks\\my-bank.json');
    eq(r.bank.title, 'my-bank');
  });
  test('invalid JSON blocks import', function () {
    var r = B.parse('{ nope', 'x.json');
    assert(!r.ok && hasError(r, 'not valid JSON'));
  });
  test('duplicate option text, duplicate question text and unknown fields are warnings', function () {
    var a = q('a', 0); a.options[1] = ' option 0 OF a '; a.extra = 1;
    var b = q('b', 0); b.question = 'Question a?';
    var r = B.normalise(bank([a, b], { foo: 1 }), 'x.json');
    assert(r.ok, r.errors.join('; '));
    assert(r.warnings.length >= 4, r.warnings.join('; '));
  });
  test('summary text', function () {
    var a = q('a', 0); a.unverified = true;
    var r = B.normalise(bank([a, q('b', 1)]), 'x.json');
    eq(B.summaryText(r.bank, 0), "Bank 'T', 2 questions, 1 unverified, 0 warnings");
  });
  test('exam questionCount is kept as written (uses cap it at the bank size)', function () {
    var r = B.normalise(bank([q('a', 0), q('b', 0)]), 'x.json');
    eq(r.bank.exam.questionCount, 60, 'default kept, so adding questions later can reach it');
    r.bank.id = 'qc';
    var e = E.createSession(r.bank, { count: Math.min(r.bank.exam.questionCount, r.bank.questions.length), timeLimitMinutes: 0, passMarkPercent: 70 }, seeded(1), 1000);
    eq(e.ids.length, 2);
  });

  /* 2. Identity */
  group('2. Identity');
  test('whitespace/case variants give the same fallback id', function () {
    eq(B.fallbackId('  What   IS\tthis? '), B.fallbackId('what is this?'));
    assert(/^h-[0-9a-f]{8}$/.test(B.fallbackId('x')));
  });
  test('FNV-1a known value', function () { eq(B.fnv1a(''), '811c9dc5'); eq(B.fnv1a('a'), 'e40c292c'); });
  test('questions without ids get stable fallback ids', function () {
    var r1 = B.normalise([{ question: 'Hello  World', options: ['a', 'b'], answer: 0 }], 'x.json');
    var r2 = B.normalise([{ question: 'hello world', options: ['a', 'b'], answer: 0 }], 'x.json');
    eq(r1.bank.questions[0].id, r2.bank.questions[0].id);
  });

  /* 3. Merge on update */
  group('3. Merge on update');
  test('kept / new / removed counts and progress', function () {
    var oldB = B.normalise(bank([q('a', 0), q('b', 0), q('c', 0)]), 'x.json').bank;
    var newB = B.normalise(bank([q('b', 0), q('c', 1), q('d', 0), q('e', 0)]), 'x.json').bank;
    var progress = { a: prog(1, 1, 1, [true], true), b: prog(2, 1, 0, [true, false], false) };
    var m = B.mergeUpdate(oldB, newB, progress);
    eq([m.kept, m.added, m.removed], [2, 2, 1]);
    eq(m.progress.b, progress.b);
    assert(!m.progress.a, 'removed id progress deleted');
    assert(!m.progress.d, 'new id starts as New');
  });

  /* 4. Weakness and weight */
  group('4. Weakness and weight');
  var cases = [
    { name: 'new', p: null, status: 'new', w: 0.75, weights: [1, 3.25, 6.25] },
    { name: 'weak (last grade Again)', p: fp(2, 1, 1, 7), status: 'weak', w: 1, weights: [1, 4, 8] },
    { name: 'learning, not yet due (D 5 → 0.15)', p: fp(10, 3, 4, 5), status: 'learning', w: 0.15, weights: [1, 1.45, 2.05] },
    { name: 'mastered, not yet due (D 2 → 0.06)', p: fp(30, 3, 10, 2), status: 'mastered', w: 0.06, weights: [1, 1.18, 1.42] },
    { name: 'learning, 5 days overdue at S 10 → 0.5', p: fp(10, 3, -5, 5), status: 'learning', w: 0.5, weights: [1, 2.5, 4.5] },
    { name: 'long overdue is capped at 0.8', p: fp(2, 4, -10, 5), status: 'learning', w: 0.8, weights: [1, 3.4, 6.6] },
    { name: 'mastered then missed → weak', p: W.record(fp(30, 3, 10, 2), 1), status: 'weak', w: 1, weights: [1, 4, 8] },
    { name: 'legacy record, last answer wrong → weak', p: prog(3, 2, 0, [true, true, false], false), status: 'weak', w: 1, weights: [1, 4, 8] }
  ];
  cases.forEach(function (c) {
    test(c.name + ': status, w and weight at F = 1, 4, 8', function () {
      eq(W.status(c.p), c.status, 'status');
      near(W.weakness(c.p), c.w, 1e-6, 'w');
      [1, 4, 8].forEach(function (F, i) { near(W.weight(c.p, F), c.weights[i], 1e-5, 'weight F=' + F); });
    });
  });
  test('legacy records migrate on read and keep their counters', function () {
    var old = prog(4, 3, 2, [false, true, true, true], true);
    var p = W.get({ x: old }, 'x');
    eq([p.reps, p.lapses, p.difficulty, p.stability, p.lastGrade], [4, 0, 5, 6, 3]);
    eq([p.seen, p.correct, p.streak], [4, 3, 2]);
    eq(p.due, iso(Date.parse(old.lastSeen) + 6 * DAY), 'due one interval after last seen'); eq(p.lastReview, old.lastSeen);
    eq(old.reps, undefined, 'stored record is not modified');
    var next = W.record(p, 3, '2026-02-01T00:00:00.000Z');
    eq([next.seen, next.correct, next.streak, next.reps], [5, 4, 3, 5]);
    assert(next.recent === undefined && next.lastCorrect === undefined, 'new shape only');
  });

  /* 5. Sampling */
  group('5. Sampling');
  var ids30 = []; for (var i = 0; i < 30; i++) ids30.push('q' + i);
  test('no duplicates', function () {
    for (var t = 0; t < 200; t++) {
      var s = W.weightedSample(ids30, function () { return 1 + Math.random() * 7; }, 10);
      var seen = {}; s.forEach(function (x) { assert(!seen[x], 'duplicate ' + x); seen[x] = 1; });
      eq(s.length, 10);
    }
  });
  test('returns min(n, pool)', function () {
    eq(W.weightedSample(ids30, function () { return 1; }, 50).length, 30);
    eq(W.weightedSample([], function () { return 1; }, 5).length, 0);
  });
  test('20,000 single draws from {4, 1} ≈ 4:1 (±10%)', function () {
    var a = 0, b = 0;
    for (var t = 0; t < 20000; t++) {
      var s = W.weightedSample(['A', 'B'], function (x) { return x === 'A' ? 4 : 1; }, 1);
      if (s[0] === 'A') a++; else b++;
    }
    var ratio = a / b;
    assert(ratio >= 3.6 && ratio <= 4.4, 'ratio ' + ratio.toFixed(3));
  });
  test('Strong focus favours weak questions', function () {
    var qs = ids30.map(function (id) { return { id: id }; });
    var progress = {};
    ids30.forEach(function (id, i) { progress[id] = i < 5 ? WEAK() : MASTERED(); });
    var weakHits = 0;
    for (var t = 0; t < 2000; t++) {
      var pick = W.selectPractice(qs, progress, 5, 2).ids;
      weakHits += pick.filter(function (id) { return Number(id.slice(1)) < 5; }).length;
    }
    // Weak share of weight: 5*4 / (5*4 + 25*1.18) = 40% of draws ≫ the 17% uniform share.
    assert(weakHits / (2000 * 5) > 0.3, 'weak share ' + (weakHits / 10000).toFixed(3));
  });

  /* 6. Weak only */
  group('6. Weak only');
  var wq = ['m1', 'm2', 'm3', 'x1', 'x2'].map(function (id) { return { id: id }; });
  var mp = { m1: MASTERED(), m2: MASTERED(), m3: MASTERED(), x1: WEAK() };
  test('pool excludes Mastered', function () {
    for (var t = 0; t < 100; t++) {
      var r = W.selectPractice(wq, mp, 2, 4);
      eq(r.ids.slice().sort(), ['x1', 'x2']);
      eq(r.notice, null);
    }
  });
  test('fills from Mastered when the pool is too small', function () {
    var r = W.selectPractice(wq, mp, 4, 4);
    eq(r.ids.length, 4);
    assert(r.ids.indexOf('x1') >= 0 && r.ids.indexOf('x2') >= 0, 'pool included');
    eq(r.ids.filter(function (id) { return id[0] === 'm'; }).length, 2);
  });
  test('falls back to Strong when everything is mastered', function () {
    var all = { m1: mp.m1, m2: mp.m2, m3: mp.m3, x1: mp.m1, x2: mp.m1 };
    var r = W.selectPractice(wq, all, 3, 4);
    eq(r.ids.length, 3);
    eq(r.notice, W.ALL_MASTERED_NOTICE);
  });

  /* 7. Attempt counting */
  group('7. Attempt counting');
  var tb = B.normalise(bank([q('a', [1]), q('b', [0, 2]), q('c', [3])]), 'x.json').bank;
  tb.id = 'test-bank';
  var tmap = B.byId(tb);
  var T1 = '2026-03-01T09:00:00.000Z', T2 = '2026-03-01T09:05:00.000Z';
  test('round 1 counts; wrong is Again at once, right waits for a rating; retries do not change progress', function () {
    var progress = {};
    var s = P.createSession(tb, ['a', 'b', 'c'], progress, { focus: 2 });
    P.applyAnswer(s, progress, tmap.a, [0], T1);    // wrong
    eq(P.needsRating(s, tmap.a), false, 'wrong answers are not rated');
    eq(progress.a.seen, 1); eq(progress.a.streak, 0); eq(progress.a.lastGrade, 1);
    P.applyAnswer(s, progress, tmap.b, [2, 0], T1); // right (order-insensitive)
    eq(P.needsRating(s, tmap.b), true);
    assert(!progress.b, 'right answer not recorded before rating');
    P.applyRating(s, progress, tmap.b, 2, T1);
    eq(progress.b.correct, 1); eq(progress.b.streak, 1); eq(progress.b.lastGrade, 2);
    P.applyAnswer(s, progress, tmap.c, [3], T1);    // right
    P.applyRating(s, progress, tmap.c, 4, T1);
    eq(progress.c.lastGrade, 4);
    P.finishRound(s);
    eq(P.firstAttemptCorrect(s), 2);
    var before = JSON.stringify(progress);
    P.startRetry(s);
    eq(s.queue, ['a']);
    P.applyAnswer(s, progress, tmap.a, [1], T2);
    eq(P.needsRating(s, tmap.a), false, 'retry rounds are not rated');
    P.applyRating(s, progress, tmap.a, 4, T2);
    eq(JSON.stringify(progress), before, 'progress unchanged in retry');
    assert(s.solved.a, 'retry still marks solved');
  });
  test('the exam date cap is worked out at answer time from the bank\'s exam date', function () {
    SET.storage.deleteAll();
    SET.storage.saveBank(tb);
    var answeredAt = new Date(2026, 2, 1, 9, 0).getTime();
    SET.storage.touch(tb.id, { examDate: '2026-03-04' });
    var progress = {};
    var s = P.createSession(tb, ['a'], progress, { focus: 2 });
    P.applyAnswer(s, progress, tmap.a, [1], iso(answeredAt));
    P.applyRating(s, progress, tmap.a, 4, iso(answeredAt)); // Easy on a new card would be ~16 days
    assert(Date.parse(progress.a.due) <= new Date(2026, 2, 3).getTime(), 'due by the morning before the exam: ' + progress.a.due);
    SET.storage.deleteAll();
  });
  test('partial multi-answer selection is wrong (all-or-nothing)', function () {
    assert(!W.isCorrect([0], [0, 2]));
    assert(!W.isCorrect([0, 1, 2], [0, 2]));
    assert(W.isCorrect([2, 0], [0, 2]));
  });
  test('exam answers update progress; unanswered are wrong', function () {
    var progress = { a: prog(3, 3, 3, [true, true, true], true) };
    var s = E.createSession(tb, { count: 3, timeLimitMinutes: 90, passMarkPercent: 60 }, seeded(1), 1000);
    s.answers = { a: [0], b: [0, 2] }; // a wrong, b right, c unanswered
    var r = E.grade(s, tmap, progress, 61000);
    eq(r.correct, 1); eq(r.total, 3); eq(r.scorePercent, 33); eq(r.passed, false);
    eq(r.timeUsedSec, 60);
    eq(progress.a.streak, 0, 'streak resets on a miss');
    eq(W.status(progress.a), 'weak');
    eq(progress.a.lastGrade, 1, 'wrong = Again');
    eq(progress.b.seen, 1);
    eq(progress.b.lastGrade, 3, 'right = Good');
    assert(!progress.c, 'unanswered not recorded');
  });
  test('streak resets on a miss and rebuilds; seen and correct keep counting', function () {
    var p = null;
    [3, 3, 1, 3, 2, 4].forEach(function (g) { p = W.record(p, g, T1); });
    eq(p.streak, 3); eq(p.seen, 6); eq(p.correct, 5); eq(p.reps, 6); eq(p.lapses, 1);
  });

  /* 8. Option shuffle */
  group('8. Option shuffle');
  test('remapped answer still checks as correct', function () {
    var rng = seeded(42);
    for (var t = 0; t < 500; t++) {
      var n = 2 + Math.floor(rng() * 9);
      var answer = W.shuffle(Array.from({ length: n }, function (_, i) { return i; }), rng).slice(0, 1 + Math.floor(rng() * n)).sort(function (a, b) { return a - b; });
      var order = W.optionOrder(n, true, rng);
      var shown = W.toDisplay(order, answer);
      var back = W.toOriginal(order, shown);
      assert(W.isCorrect(back, answer), 'order ' + order + ' answer ' + answer);
      shown.forEach(function (d) { assert(answer.indexOf(order[d]) >= 0, 'display position maps to an answer'); });
    }
  });
  test('no shuffle keeps original order', function () { eq(W.optionOrder(4, false), [0, 1, 2, 3]); });

  /* 9. Real bank */
  group('9. banks/tprm.json');
  // banks/tprm.json is kept out of the repository, so these run only where the local copy exists.
  function needsTprm(name, fn) {
    if (window.TPRM_BANK) test(name, fn);
    else test(name + ' (skipped: tests/tprm-data.js not present)', function () {});
  }
  needsTprm('validates with 0 errors and 180 questions', function () {
    var r = B.normalise(JSON.parse(JSON.stringify(window.TPRM_BANK)), 'tprm.json');
    eq(r.errors.length, 0, r.errors.slice(0, 3).join('; '));
    eq(r.bank.questions.length, 180);
    eq(r.bank.title, 'ServiceNow CIS-TPRM practice');
  });

  /* 10. FSRS state update
     Expected values come from the reference ts-fsrs 4.x (FSRS-5, same default weights),
     not from this implementation, so a transcription error in a formula fails here. */
  group('10. FSRS state update');
  var F = SET.fsrs;
  var NOW = Date.parse('2026-06-01T12:00:00.000Z');
  test('first review: stability and difficulty from the grade alone', function () {
    var expect = { 1: [0.40255, 7.1949, 1], 2: [1.18385, 6.48830527, 1], 3: [3.173, 5.28243442, 3], 4: [15.69105, 3.22450159, 16] };
    [1, 2, 3, 4].forEach(function (g) {
      var n = F.next(null, g, NOW, null);

    assert(hasError(r, 'topic "constructor" is a reserved name'), r.errors.join('; '));
    var w = B.parse('#weight,__proto__,50\n#weight,A,50\n' + HEAD + 'q1,Q?,a,b,,,A,,A,\n', 'w.csv');
    assert(w.ok, w.errors.join('; '));
    eq(Object.keys(w.bank.exam.topicWeights), ['A']);
    eq(['polluted'].filter(function (k) { return k in {}; }), []);
    var big = B.parse(new Array(C.MAX_BYTES + 2).join('x'), 'big.csv');
    assert(!big.ok && big.errors[0] === C.TOO_LARGE, big.errors[0]);
  });
  testAsync('a file saved in an older Excel format is read as windows-1252, with a warning', function () {
    var bytes = new Uint8Array([105, 100, 44, 113, 117, 101, 115, 116, 105, 111, 110, 44, 65, 44, 66, 44, 97, 110, 115, 119, 101, 114, 10, // id,question,A,B,answer
      113, 49, 44, 67, 97, 102, 0xE9, 63, 44, 120, 44, 121, 44, 65, 10]);                                                    // q1,Café?,x,y,A
    var file = new File([bytes], 'old.csv', { type: 'text/csv' });

  testAsync('a file over 10 MB is refused before it is read', function () {
    var file = { size: C.MAX_BYTES + 1 };

  /* 27. Optimiser */
  group('27. Optimiser');
  var O = SET.optimizer;
  // Reviews of nQ questions over `days`, scheduled by the app (default weights) while recall
  // follows trueW: what the log of someone whose memory differs from the defaults looks like.
  function simulate(trueW, seed, nQ, days) {
    var rng = seeded(seed), log = [], t0 = at('2026-01-05T09:00'), end = t0 + days * DAY;
    for (var i = 0; i < nQ; i++) {
      var t = t0 + Math.floor(rng() * 20) * DAY + Math.floor(rng() * 8) * 3600000;
      var truth = null, sched = null, lastT = t;
      while (t < end) {
        var g, el = (t - lastT) / DAY;
        if (!truth) g = rng() < 0.2 ? 1 : rng() < 0.8 ? 3 : 4;
        else g = rng() < F.retrievability(el, truth.s) ? (rng() < 0.15 ? 2 : rng() < 0.2 ? 4 : 3) : 1;
        log.push(['q' + i, t, g, 'p']);
        truth = F.step(truth, g, el, false, trueW);
        sched = F.step(sched, g, el, false);
        lastT = t;
        t += Math.max(1, Math.round(Math.max(1, Math.round(F.interval(sched.s))) * (0.6 + 0.8 * rng()))) * DAY + Math.floor(rng() * 4) * 3600000;
      }
    }
    return log;
  }
  var TRUE_W = F.DEFAULT_WEIGHTS.slice();
  TRUE_W[0] = 0.15; TRUE_W[1] = 0.4; TRUE_W[2] = 0.9; TRUE_W[3] = 3; TRUE_W[8] = 0.6; TRUE_W[10] = 1.2; // clearly weaker memory than the defaults
  var simData = O.buildData([{ id: 'sim', reviews: simulate(TRUE_W, 9, 200, 90) }]);
  test('enough synthetic history passes the thresholds', function () {
    var st = O.status(simData);
    assert(st.ready, JSON.stringify(st));
  });
  test('synthetic recovery: the fit beats the defaults and comes close to the true weights', function () {
    var res = O.fit(simData, { steps: 60 });
    var truth = O.evaluate(TRUE_W, simData, res.splitT).test;
    var trueLoss = truth.loss / truth.n;
    assert(res.accepted, 'accepted: ' + res.logLossBefore + ' → ' + res.logLossAfter);
    assert(res.logLossAfter < res.logLossBefore, 'better than defaults');
    assert(res.logLossAfter <= trueLoss * 1.05, 'fitted ' + res.logLossAfter + ' vs true ' + trueLoss);
    assert(F.validWeights(res.weights), 'within bounds');
  });
  test('history generated from the defaults keeps the defaults (≥ 2% rule)', function () {
    var data = O.buildData([{ id: 'def', reviews: simulate(F.DEFAULT_WEIGHTS, 11, 200, 90) }]);
    var res = O.fit(data, { steps: 30 });
    eq(res.accepted, false, res.logLossBefore + ' → ' + res.logLossAfter);
  });
  test('thresholds block optimising on too little history', function () {
    var small = O.buildData([{ id: 's', reviews: simulate(TRUE_W, 3, 20, 10) }]);
    var st = O.status(small);
    eq(st.ready, false);
    assert(st.reviews < O.MIN_REVIEWS && st.questions < O.MIN_QUESTIONS && st.days < O.MIN_DAYS, JSON.stringify(st));
    var empty = O.status(O.buildData([]));
    eq([empty.ready, empty.reviews, empty.questions, empty.days], [false, 0, 0, 0]);
  });
  test('extreme data (all right, all wrong) stays within bounds with no NaN or Infinity', function () {
    [4, 1].forEach(function (grade) {
      var log = [];
      for (var i = 0; i < 30; i++) for (var d = 0; d < 6; d++) log.push(['x' + i, at('2026-01-05T09:00') + (d * d + d) * DAY, grade, 'p']);
      var res = O.fit(O.buildData([{ id: 'x', reviews: log }]), { steps: 10 });
      assert(F.validWeights(res.weights), 'grade ' + grade + ': ' + JSON.stringify(res.weights));
      assert(isFinite(res.logLossBefore) && isFinite(res.logLossAfter), 'finite losses');
    });
  });
  test('replaying the log rebuilds exactly the state recorded live (default weights)', function () {
    var t = at('2026-02-01T08:00'), p = null, log = [];
    [[0, 3], [0.1, 1], [0.2, 3], [1.2, 2], [4, 3], [4.1, 3], [12, 1], [13, 4], [40, 3]].forEach(function (x) {
      var when = t + x[0] * DAY;
      p = W.record(p, x[1], iso(when));
      log.push(['q', when, x[1], 'p']);
    });
    eq(O.replayRecord(log), p);
  });
  test('the same log gives the same weights every time', function () {
    eq(O.fit(simData, { steps: 15 }).weights, O.fit(simData, { steps: 15 }).weights);
  });
  test('applying weights rebuilds questions from the log; reset restores the original due dates', function () {
    SET.storage.deleteAll();
    var b = B.normalise(bank([q('a', [0]), q('b', [0]), q('old', [0])]), 'x.json').bank; b.id = 'opt';
    SET.storage.saveBank(b);
    var progress = {}, t = at('2026-02-01T08:00');
    [['a', 0, 3], ['b', 0, 1], ['a', 2, 3], ['b', 1, 3], ['a', 9, 4]].forEach(function (x) {
      var when = t + x[1] * DAY;
      progress[x[0]] = W.record(progress[x[0]], x[2], iso(when));
      SET.storage.logReview('opt', x[0], when, x[2], 'p');
    });
    progress.old = W.record(null, 3, iso(t - 5 * DAY)); // history from before logging began (not in the log)
    SET.storage.saveProgress('opt', progress, false);
    var original = JSON.stringify(SET.storage.getProgress('opt'));
    var rebuilt = O.apply({ weights: TRUE_W, reviews: 5, logLossBefore: 0.5, logLossAfter: 0.4 }, t + 10 * DAY);
    eq(rebuilt, 2, 'a and b rebuilt; old kept');
    eq(F.weights(), TRUE_W, 'scheduler uses the fitted weights');
    eq(SET.storage.getSettings().fsrs.weights, TRUE_W);
    var after = SET.storage.getProgress('opt');
    assert(after.a.stability !== progress.a.stability, 'a changed');
    eq(after.old, progress.old, 'old history kept');
    O.apply(null, t + 10 * DAY);
    eq(F.weights(), F.DEFAULT_WEIGHTS, 'defaults again');
    eq(SET.storage.getSettings().fsrs, null);
    eq(JSON.stringify(SET.storage.getProgress('opt')), original, 'original due dates');
    SET.storage.deleteAll();
  });
  test('fitted weights go into backups and are checked on restore', function () {
    SET.storage.deleteAll();
    SET.storage.saveSettings({ fsrs: { weights: TRUE_W, fittedAt: iso(NOW), reviews: 500, logLossBefore: 0.5, logLossAfter: 0.4 } });
    var backup = SET.storage.exportBackup();
    eq(backup.settings.fsrs.weights, TRUE_W);
    SET.storage.deleteAll();
    eq(F.weights(), F.DEFAULT_WEIGHTS, 'deleting everything resets the scheduler');
    backup.settings.fsrs.weights = TRUE_W.map(function () { return 1e9; }); // out of bounds
    SET.storage.importBackup(backup, 'replace');
    eq(SET.storage.getSettings().fsrs, null, 'bad weights ignored');
    backup.settings.fsrs.weights = TRUE_W;
    SET.storage.importBackup(backup, 'replace');
    eq(F.weights(), TRUE_W, 'restored and in use');
    SET.storage.deleteAll();
  });
  test('the personalise prompt appears when ready, then every 30 days or 1,000 reviews', function () {
    var ready = { ready: true, reviews: 500 };
    eq(O.shouldPrompt({ ready: false, reviews: 10 }, {}, NOW), false);
    eq(O.shouldPrompt(ready, {}, NOW), true);
    eq(O.shouldPrompt(ready, { fsrsPrompt: { at: iso(NOW - 5 * DAY), reviews: 450 } }, NOW), false);
    eq(O.shouldPrompt(ready, { fsrsPrompt: { at: iso(NOW - 31 * DAY), reviews: 450 } }, NOW), true);
    eq(O.shouldPrompt({ ready: true, reviews: 1500 }, { fsrsPrompt: { at: iso(NOW - DAY), reviews: 450 } }, NOW), true);
  });
  test('target retention changes intervals; settings are checked', function () {
    SET.storage.deleteAll();
    var base = F.interval(10);
    SET.storage.saveSettings({ targetRetention: 0.95 });
    assert(F.interval(10) < base, 'higher retention, shorter interval');
    SET.storage.saveSettings({ targetRetention: 3 });
    eq(SET.storage.getSettings().targetRetention, 0.9, 'out of range: default');
    near(F.interval(10), base, 1e-9);
    SET.storage.saveSettings({ newPerDay: 500 });
    eq(SET.storage.getSettings().newPerDay, 20, 'out of range: default');
    SET.storage.deleteAll();
  });
  var STORAGE_FIGURE = '';
  (function () {
    var qs = []; for (var i = 1; i <= 500; i++) { var x = q('q' + ('00' + i).slice(-3), [1]); x.question = new Array(16).join('Words in a typical question '); x.explanation = new Array(8).join('An explanation sentence. '); qs.push(x); }
    var b = B.normalise(bank(qs), 'x.json').bank;
    var log = [];
    for (var j = 0; j < 20000; j++) log.push(['q' + ('00' + (j % 500 + 1)).slice(-3), 1790000000000 + j * 60000, 1 + (j % 4), j % 5 ? 'p' : 'e']);
    var progress = {};
    qs.forEach(function (x) { progress[x.id] = W.record(W.record(null, 3, iso(NOW)), 3, iso(NOW + 3 * DAY)); });
    var bytes = (JSON.stringify(b) + JSON.stringify(log) + JSON.stringify(progress)).length * 2; // localStorage counts UTF-16
    STORAGE_FIGURE = Math.round(bytes / 1024) + ' KB (bank ' + Math.round(JSON.stringify(b).length * 2 / 1024) + ' KB, log ' + Math.round(JSON.stringify(log).length * 2 / 1024) + ' KB, progress ' + Math.round(JSON.stringify(progress).length * 2 / 1024) + ' KB)';
    STORAGE_FIGURE = { bytes: bytes, text: STORAGE_FIGURE };
  })();
  test('storage: a 500-question bank with 20,000 logged reviews stays well under 5 MB — measured ' + STORAGE_FIGURE.text, function () {
    assert(STORAGE_FIGURE.bytes < 2.5 * 1024 * 1024, STORAGE_FIGURE.text);
  });

  /* 28. Clean-up of duplicates */
  group('28. Clean-up of duplicates');
  function cq(id, text, options, answer, extra) {
    var x = { id: id, question: text, options: options, answer: answer };
    if (extra) Object.keys(extra).forEach(function (k) { x[k] = extra[k]; });
    return x;
  }
  test('identical questions (any option order or letter) are reduced to one copy', function () {
    var b = B.normalise(bank([cq('a', 'What is X?', ['One', 'Two', 'Three'], 'B'), cq('b', 'what is  x?', ['Three', ' Two', 'One'], 'B', { explanation: 'Because.', topic: 'T' }),
      cq('c', 'Other?', ['x', 'y'], 'A')]), 'x.json').bank;
    var r = B.cleanDuplicates(b);
    eq(r.removedIds, ['b']);
    eq(r.bank.questions.map(function (x) { return x.id; }), ['a', 'c']);
    eq([r.bank.questions[0].explanation, r.bank.questions[0].topic], ['Because.', 'T'], 'missing details taken from the copy');
    eq(r.manual, []);
  });
  test('the copy with progress is the one kept', function () {
    var b = B.normalise(bank([cq('a', 'Q?', ['x', 'y'], 'A'), cq('b', 'Q?', ['x', 'y'], 'A')]), 'x.json').bank;
    eq(B.cleanDuplicates(b, { b: fp(10, 3, 5) }).removedIds, ['a']);
  });
  test('same wording with a different answer is left alone and listed for a manual check', function () {
    var b = B.normalise(bank([cq('a', 'Q?', ['x', 'y'], 'A'), cq('b', 'Q?', ['x', 'y'], 'B')]), 'x.json').bank;
    var r = B.cleanDuplicates(b);
    eq(r.removedIds, []);
    eq(r.manual.length, 1);
    assert(r.manual[0].indexOf('ids a, b') >= 0, r.manual[0]);
  });
  test('a repeated option is removed and the answer letters move up', function () {
    var b = B.normalise(bank([cq('a', 'Q?', ['Red', 'Blue', 'Red', 'Green'], 'D'), cq('b', 'P?', ['Red', 'Blue', 'Red ', 'Green'], 'C')]), 'x.json').bank;
    var r = B.cleanDuplicates(b);
    eq(r.fixedIds, ['a', 'b']);
    eq([r.bank.questions[0].options, r.bank.questions[0].answer], [['Red', 'Blue', 'Green'], [2]]);
    eq([r.bank.questions[1].options, r.bank.questions[1].answer], [['Red', 'Blue', 'Green'], [0]], 'answer on the copy maps to the kept option');
    eq(B.answerChanged(b.questions[0], r.bank.questions[0]), false, 'progress is kept');
  });
  test('repeated options that can\'t be fixed safely are listed instead', function () {
    var b = B.normalise(bank([cq('a', 'Q?', ['x', 'x ', 'y'], ['A', 'B']), cq('b', 'P?', ['x', 'x'], 'A')]), 'x.json').bank;
    var r = B.cleanDuplicates(b);
    eq(r.fixedIds, []);
    eq(r.manual.length, 2);
    eq(JSON.stringify(r.bank), JSON.stringify(b), 'unchanged');
  });
  test('cleaning a stored bank drops the removed copies\' progress and history, and running it twice changes nothing', function () {
    SET.storage.deleteAll();
    var b = B.normalise(bank([cq('a', 'Q?', ['x', 'y', 'x'], 'A'), cq('b', 'P?', ['x', 'y'], 'A'), cq('c', 'P?', ['y', 'x'], 'B')]), 'x.json').bank;
    b.id = 'clean';
    SET.storage.saveBank(b);
    SET.storage.saveProgress('clean', { a: fp(10, 3, 5), b: fp(10, 3, 5), c: fp(2, 3, 5) }, false);
    SET.storage.logReviews('clean', [{ id: 'a', when: 1000, grade: 3, mode: 'p' }, { id: 'c', when: 2000, grade: 3, mode: 'p' }]);
    var r = SET.editor.cleanBank('clean');
    eq([r.ok, r.removedIds, r.fixedIds], [true, ['c'], ['a']]);
    var stored = SET.storage.getBank('clean');
    eq(stored.questions.map(function (x) { return x.id; }), ['a', 'b']);
    assert(stored.editedAt, 'counts as an in-app change');
    eq(Object.keys(SET.storage.getProgress('clean')).sort(), ['a', 'b']);
    eq(SET.storage.getReviews('clean').map(function (x) { return x[0]; }), ['a']);
    var again = SET.editor.cleanBank('clean');
    eq([again.removedIds, again.fixedIds], [[], []]);
    SET.storage.deleteAll();
  });

  test('options that differ only in letter case are different options', function () {
    var src = cq('q113', 'What is the object name?', ['Incident.Major_Incident', 'incident=>major_incident', 'incident<=>major_incident', 'incident||major_incident', 'incident.major_incident'], 'E');
    var r = B.normalise(bank([src]), 'x.json');

  test('every same-worded group is offered for review, flagged when its copies are identical', function () {
    var b = B.normalise(bank([cq('a', 'Q?', ['x', 'y'], 'A'), cq('b', 'q? ', ['x', 'y'], 'B'), cq('c', 'P?', ['x', 'y'], 'A'), cq('d', 'P?', ['y', 'x'], 'B'),
